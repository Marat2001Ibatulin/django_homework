<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book_Page</title>
</head>
<body>
<div class="header">
    <h1><a href="http://127.0.0.1:8000/">Каталог</a></h1>
</div>
{% for e in page %}
<p> {{ e }}</p>
{% endfor %}
{% if page.has_previous %}
<a href='http://127.0.0.1:8000/{{ prev_date }}'>{{ prev_date}}</a>
{% endif %}
{% if page.has_next %}
<a href='http://127.0.0.1:8000/{{ next_date }}'>{{ next_date}}</a>
{% endif %}
</body>
</html>
